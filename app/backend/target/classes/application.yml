spring:
  application:
    name: governance-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/governance}
    username: ${DB_USERNAME:governance}
    password: ${DB_PASSWORD:governance}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    # Vite dev server origin; empty in production (nginx proxies /api same-origin).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
