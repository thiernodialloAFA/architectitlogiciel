name: governance-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: governance
      POSTGRES_USER: governance
      # Demo-only credentials for the local case-study stack — do not reuse anywhere real.
      POSTGRES_PASSWORD: governance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance -d governance"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/governance
      DB_USERNAME: governance
      DB_PASSWORD: governance
      # The SPA is served same-origin through nginx, so no CORS origins are needed.
      APP_CORS_ALLOWED_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080" # direct API + Swagger UI access (http://localhost:8081/swagger-ui.html)

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80" # the app: http://localhost:8080

volumes:
  db-data:
